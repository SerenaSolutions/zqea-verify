name: 'Z-QEA Receipt Verifier'
description: 'Verify Z-QEA receipts: SHA3-256 seal + ML-DSA-44 post-quantum signature + quantum entropy audit.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  receipt-file:
    description: 'Path to the receipt JSON to verify'
    required: true
outputs:
  status:
    description: '"INTEGRAL" or "BROKEN"'
    value: ${{ steps.verify.outputs.status }}
  seal:
    description: 'Recomputed SHA3-256 seal'
    value: ${{ steps.verify.outputs.seal }}
runs:
  using: 'composite'
  steps:
    - name: 'Install post-quantum core (ML-DSA-44)'
      shell: bash
      run: pip install --quiet pqcrypto
    - name: 'Verify Z-QEA receipt seal'
      id: verify
      shell: bash
      run: |
        python3 "${{ github.action_path }}/zqea_verify.py" "${{ inputs.receipt-file }}"
